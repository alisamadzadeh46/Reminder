{% extends "base_auth.html" %}
{% block title %}ورود{% endblock %}
{% block page_title %}ورود{% endblock %}
{% block page_subtitle %}برای ورود اطلاعات خود را وارد کنید{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post" class="d-grid gap-3">
          {% csrf_token %}

          <div>
            <label class="form-label">نام کاربری</label>
            <input type="text" name="username" class="form-control" required autocomplete="username">
          </div>

          <div>
            <label class="form-label">رمز عبور</label>
            <input type="password" name="password" class="form-control" required autocomplete="current-password">
          </div>

          <button class="btn btn-primary">
            <i class="bi bi-box-arrow-in-left ms-1"></i>
            ورود
          </button>

          <div class="text-center muted small">
            حساب ندارید؟
            <a href="{% url 'register' %}">ثبت‌نام</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

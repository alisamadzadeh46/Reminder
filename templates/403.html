{% extends "base.html" %}
{% block title %}عدم دسترسی{% endblock %}
{% block page_title %}عدم دسترسی{% endblock %}
{% block page_subtitle %}شما اجازه انجام این عملیات را ندارید{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <div class="alert alert-danger mb-3">
          {{ message|default:"اجازه دسترسی ندارید." }}
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary" href="javascript:history.back()">بازگشت</a>
          <a class="btn btn-primary" href="{% url 'dashboard' %}">داشبورد</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
